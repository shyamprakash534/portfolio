name: One-time hero video cleanup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/clean-gemini-watermark.yml"
      - "scripts/remove_gemini_watermark.py"

permissions:
  contents: write

jobs:
  clean-hero-video:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check opencv-python-headless==4.10.0.84 numpy==1.26.4

      - name: Clean the hero video
        run: python scripts/remove_gemini_watermark.py

      - name: Commit the cleaned video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/hero-video.mp4
          if git diff --cached --quiet; then
            echo "No video change detected."
            exit 0
          fi
          git commit -m "Remove Gemini watermark from portfolio hero video"
          git push origin HEAD:main
